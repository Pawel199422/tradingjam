name: Skan rynku

on:
  schedule:
    - cron: '1 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # pozwala uruchomić kolejny skan (łańcuch co godzinę)

concurrency:
  group: skan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Skanowanie Binance + BingX
        run: node scanner/scanner.js

      - name: Bot na sucho (wirtualne konto)
        continue-on-error: true
        run: node bot/paper.js

      - name: Publikacja wyników (gałąź "data")
        run: |
          cd out
          git init -q
          git config user.name "skaner-bot"
          git config user.email "skaner-bot@users.noreply.github.com"
          git checkout -q -b data
          git add results.json history.json
          if [ -f bot.json ]; then git add bot.json; fi
          git commit -q -m "Skan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      # GitHub często pomija automatyczny harmonogram w małych repozytoriach.
      # Dlatego każdy skan sam uruchamia następny – o 1 minucie po kolejnej pełnej godzinie.
      - name: Zaplanowanie kolejnego skanu
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          now=$(date -u +%s)
          next=$(( (now / 3600 + 1) * 3600 + 60 ))
          wait=$(( next - now ))
          if [ $wait -gt 2700 ]; then wait=60; fi
          echo "Czekam $wait s do kolejnego skanu"
          sleep $wait
          gh workflow run scan.yml --repo "$GITHUB_REPOSITORY" --ref main
